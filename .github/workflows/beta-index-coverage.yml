name: Beta index coverage verification

on:
  pull_request:
    paths:
      - '**/index.html'
      - '**/inndex.html'
      - '**/*_index.html'
      - '**/*-index.html'
      - 'scripts/inject-beta-links.mjs'
      - '.github/workflows/beta-index-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-index-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify canonical Beta Program coverage
        run: node scripts/inject-beta-links.mjs --check
