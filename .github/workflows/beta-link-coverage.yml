name: Beta Program Coverage

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - '**/inndex.html'
      - '**/*_index.html'
      - '**/*-index.html'
      - 'scripts/inject-beta-links.mjs'
      - '.github/workflows/beta-link-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-program-coverage-main
  cancel-in-progress: false

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Inject canonical Beta Program doorway
        run: node scripts/inject-beta-links.mjs

      - name: Verify deterministic coverage
        run: node scripts/inject-beta-links.mjs --check

      - name: Commit coverage updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "All visible index pages already have canonical Beta Program coverage."
            exit 0
          fi
          git config user.name "Verve N Veda Beta Coverage"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore(beta): enforce canonical visible index coverage [skip beta-rollout]"
          git pull --rebase origin main
          git push origin HEAD:main
