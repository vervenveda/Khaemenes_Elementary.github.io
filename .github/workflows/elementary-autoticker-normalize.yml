name: One-Time Elementary Auto Ticker Normalization

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize-elementary-autoticker.mjs'
      - '.github/workflows/elementary-autoticker-normalize.yml'

permissions:
  contents: write

concurrency:
  group: elementary-autoticker-normalize-20261114
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Normalize canonical auto-populating ticker
        run: node tools/normalize-elementary-autoticker.mjs
      - name: Re-audit all HTML before production write
        run: |
          node tools/audit-elementary-autoticker.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.elementary-autoticker-normalization.json','utf8'));
          if(r.html!==2390) throw new Error('Unexpected HTML topology: '+r.html);
          if(r.redirects!==557) throw new Error('Redirect topology changed: '+r.redirects);
          if(r.already+r.changed!==1833) throw new Error('Content coverage mismatch: '+(r.already+r.changed));
          if(r.changed!==1830) throw new Error('Expected 1830 newly normalized content pages, got '+r.changed);
          NODE
      - name: Validate curriculum and learner boundaries
        run: |
          node tools/validate-elementary-learning-engine.mjs
          node tools/validate-elementary-week06-evidence.mjs
          node tests/elementary-learner-isolation.test.cjs
          node tests/elementary-formal-boundaries.test.cjs
          node --test tests/elementary-grade1-5-lesson-retention.test.cjs
          node tools/validate-elementary-experience.mjs
      - name: Commit normalized ticker coverage
        run: |
          set -euo pipefail
          git config user.name "Verve N Veda Ecosystem Guardian"
          git config user.email "ecosystem@vervenveda.com"
          git add -- '*.html' '**/*.html' '.elementary-autoticker-normalization.json'
          if git diff --cached --quiet; then
            echo "No ticker changes required."
            exit 0
          fi
          git commit -m "Normalize auto-populating ticker across Elementary"
          git pull --rebase origin main
          git push origin HEAD:main
