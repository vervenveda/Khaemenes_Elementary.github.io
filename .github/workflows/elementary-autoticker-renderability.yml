name: One-Time Elementary Auto Ticker Renderability Repair

on:
  push:
    branches: [main]
    paths:
      - 'tools/ensure-elementary-autoticker-renderable.mjs'
      - '.github/workflows/elementary-autoticker-renderability.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Add fallback population only to no-link content pages
        run: node tools/ensure-elementary-autoticker-renderable.mjs
      - name: Validate curriculum and learner boundaries
        run: |
          node tools/validate-elementary-learning-engine.mjs
          node tools/validate-elementary-week06-evidence.mjs
          node tests/elementary-learner-isolation.test.cjs
          node tests/elementary-formal-boundaries.test.cjs
          node --test tests/elementary-grade1-5-lesson-retention.test.cjs
          node tools/validate-elementary-experience.mjs
      - name: Commit fallback ticker repair
        run: |
          set -euo pipefail
          git config user.name "Verve N Veda Ecosystem Guardian"
          git config user.email "ecosystem@vervenveda.com"
          git add -- 'games/**/*.html' 'grades/grade-01/subjects/math/math-01_index.html'
          git commit -m "Ensure auto ticker renders on standalone Elementary apps"
          git pull --rebase origin main
          git push origin HEAD:main
