name: One-Time Elementary Surgical Branch Retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elementary-branch-retirement-20261114.yml'

permissions:
  contents: write

concurrency:
  group: elementary-branch-retirement-20261114
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Revalidate reconciled main before branch deletion
        run: |
          set -euo pipefail
          grep -q 'R?.canAdult?.(ids.adultId,id,"progress.view")===true' student-profile/index.html
          grep -q 'pictureRequest' student-profile/index.html
          grep -q 'khaemenes-yearbook-profile-images.js?v=20261109-modal-v4' student-profile/index.html
          grep -q 'khaemenes-grade-five-family-view.js' student-profile/index.html
          grep -q 'Validate reconciled Grade 01–05 family and forensic guardrails' .github/workflows/elementary-learning-engine-regression.yml
          node tools/validate-elementary-learning-engine.mjs
          node tools/validate-elementary-week06-evidence.mjs
          node tests/elementary-learner-isolation.test.cjs
          node tests/elementary-formal-boundaries.test.cjs
          node --test tests/elementary-grade1-5-lesson-retention.test.cjs
          node --test \
            tests/elementary-family-report.test.cjs \
            tests/grade-one-family-guardrails.test.cjs \
            tests/grade-two-family-guardrails.test.cjs \
            tests/grade-two-post-profile-forensic.test.cjs \
            tests/grade-three-family-guardrails.test.cjs \
            tests/grade-three-instructional-forensic.test.cjs \
            tests/grade-three-deep-forensic-round3.test.cjs \
            tests/grade-four-family-guardrails.test.cjs \
            tests/grade-four-topology-repairs.test.cjs \
            tests/grade-four-late-year-instructional-depth.test.cjs \
            tests/grade-four-focus-alignment-forensic.test.cjs \
            tests/grade-five-family-guardrails.test.cjs
      - name: Verify exact source heads and delete approved refs only
        shell: bash
        env:
          TARGETS: |
            backup-elementary-before-landing-header-footer-20261027|dafb15a891ce07a61ad75f1bcc867c52f1b5c14f|ancestor
            backup-elementary-before-next-five-landings-20261027|be9f76b175726bed8d71b6d38ba4dcfda37293f1|ancestor
            backup-elementary-before-toolbar-overlap-fix-20261027|cfe907deb473b535fb299ddb806091e62b913a31|ancestor
            backup-elementary-before-uniform-beta-toolbar-20261027|c349af9d916cd7163d9f3721e889a27d9e86a1f5|ancestor
            backup-elementary-grade4-5-remaining-entrances-20261027|d41670fdf83dc3bf97e0691ee42cdba5588d15eb|ancestor
            backup-elementary-next-ten-entrances-20261027|84cdd832b9d045ef2433f7e4c50146ffd4327a36|ancestor
            backup-elementary-seven-game-toolbar-regression-20261027|5606eeb1bb4c920947d0ac07d24228647aacf793|ancestor
            backup-elementary-teacher-tools-grade2-5-20261027|6430a4169a4ffeb3b59b9dec8324624baa86a7eb|ancestor
            backup-elementary-ten-grade-subject-landings-20261027|4f2c84d0890e0f2c1398d394b93792a5fa246d4a|ancestor
            backup-elementary-ten-next-subject-headers-20261027|7f90a4415f955327de2a167f79f0b07810df199f|ancestor
            hardening/archaemenes-elementary-v2|f0c724ca83f6f6353dbb2f8638955e2180e3bd3b|ancestor
            hardening/archaemenes-elementary-v3|f0c724ca83f6f6353dbb2f8638955e2180e3bd3b|ancestor
            hardening/archaemenes-elementary-v4|f0c724ca83f6f6353dbb2f8638955e2180e3bd3b|ancestor
            fix/elementary-yearbook-photo-modal-2026-11-09|86af808d3c3c09e435884eaf35a5263f78a6ddc1|superseded
            hardening/student-profile-sibling-selection-2026-11-09|7eb3d0caab9751a31edbb08e8bd1c9163890b5fc|absorbed
            upgrade/profile-creative-rail-2026-11-09|f02012e8f58d6a07c37604d9ba07eb090f6d286b|superseded
            upgrade/profile-photo-editor-parity-2026-11-09|3497e71781a311ffaa05c65a13b01a08bc800d45|absorbed
            audit/elementary-family-report-2026-11-09|4e9e8fa78849c0f280cc996337d1ad0e05148ae4|absorbed
            integration/elementary-family-retention-reconcile-2026-11-10|beb07101a30b59fe4cf90a5c7e26a38f41bb471e|absorbed
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected kind; do
            [ -n "$branch" ] || continue
            case "$branch" in
              main|hardening/archaemenes-elementary) echo "Protected from retirement: $branch" >&2; exit 1;;
            esac
            ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$ref" || { echo "Missing target: $branch" >&2; exit 1; }
            actual="$(git rev-parse "$ref")"
            [ "$actual" = "$expected" ] || { echo "HEAD changed for $branch: $actual" >&2; exit 1; }
            if [ "$kind" = "ancestor" ]; then
              git merge-base --is-ancestor "$ref" origin/main || { echo "Not contained in main: $branch" >&2; exit 1; }
            fi
          done <<< "$TARGETS"

          while IFS='|' read -r branch expected kind; do
            [ -n "$branch" ] || continue
            echo "Deleting audited redundant branch: $branch ($expected)"
            git push origin --delete "$branch"
          done <<< "$TARGETS"
