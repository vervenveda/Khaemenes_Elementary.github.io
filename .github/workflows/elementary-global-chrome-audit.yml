name: Elementary Global Chrome Audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/audit-elementary-global-chrome.mjs'
      - '.github/workflows/elementary-global-chrome-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node tools/audit-elementary-global-chrome.mjs
