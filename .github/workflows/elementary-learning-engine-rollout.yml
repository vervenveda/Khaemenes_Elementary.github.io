name: Elementary Learning Engine Rollout

on:
  push:
    branches:
      - main
    paths:
      - 'assets/khaemenes-elementary-focus-map.js'
      - 'assets/khaemenes-elementary-question-factory.js'
      - 'assets/khaemenes-elementary-learning-ledger.js'
      - 'assets/khaemenes-elementary-assessment-engine.js'
      - 'scripts/inject-elementary-learning-engine.mjs'
      - '.github/workflows/elementary-learning-engine-rollout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elementary-learning-engine-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: "!contains(github.event.head_commit.message, '[skip learning-engine-rollout]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Inject learning engine
        run: node scripts/inject-elementary-learning-engine.mjs

      - name: Commit rollout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Every targeted lesson, quiz, and test already has the shared learning engine."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "chore(elementary): roll out learning engine [skip learning-engine-rollout]"
          git pull --rebase origin main
          git push origin HEAD:main
