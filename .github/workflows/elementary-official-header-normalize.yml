name: One-Time Elementary Official Header Normalization

on:
  push:
    branches: [main]
    paths:
      - 'tools/normalize-elementary-official-header.mjs'
      - '.github/workflows/elementary-official-header-normalize.yml'

permissions:
  contents: write

concurrency:
  group: elementary-official-header-normalize-20261114
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Normalize 49 Elementary landing headers
        run: node tools/normalize-elementary-official-header.mjs
      - name: Verify exact official header contract
        run: node tools/audit-elementary-official-header.mjs
      - name: Validate ticker, curriculum and learner boundaries
        run: |
          node tools/audit-elementary-autoticker.mjs
          node tools/validate-elementary-learning-engine.mjs
          node tools/validate-elementary-week06-evidence.mjs
          node tests/elementary-learner-isolation.test.cjs
          node tests/elementary-formal-boundaries.test.cjs
          node --test tests/elementary-grade1-5-lesson-retention.test.cjs
          node tools/validate-elementary-experience.mjs
      - name: Commit official Elementary header normalization
        run: |
          set -euo pipefail
          git config user.name "Verve N Veda Ecosystem Guardian"
          git config user.email "ecosystem@vervenveda.com"
          git add -- 'index.html' 'student-profile/index.html' 'games/index.html' 'grades/portfolio/index.html' 'grades/grade-*/index.html' 'grades/grade-*/teacher-tools/index.html' 'grades/grade-*/subjects/*/index.html'
          git commit -m "Normalize official header across Elementary landings"
          git pull --rebase origin main
          git push origin HEAD:main