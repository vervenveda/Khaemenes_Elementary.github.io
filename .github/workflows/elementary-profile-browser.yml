name: Elementary Student Profile Browser Regression
on:
  push:
    branches: [main]
    paths:
      - "student-profile/**"
      - "grades/grade-*/index.html"
      - "tests/elementary-profile-browser-smoke.mjs"
      - ".github/workflows/elementary-profile-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vervenveda/Khaemenes_Academy.github.io
          # Pin the audited shared profile contract so Elementary CI is reproducible.
          # Update this SHA deliberately when the Academy profile contract changes.
          ref: fff9d4852d71ef9288e6fbd631112d7930f52f6e
          path: shared-academy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vervenveda/vervenveda.github.io
          # Pin shared VNV ticker/header assets used by the profile page.
          ref: 200b1cb1fe3c55e4b1dc3137a83bba1d93a94417
          path: shared-vnv
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install chromium
      - name: Validate profile authorization and picture isolation source guards
        run: node --test tests/student-profile-sibling-isolation.test.cjs
      - name: Validate Elementary profile grade, appearance and sibling isolation
        run: node tests/elementary-profile-browser-smoke.mjs
