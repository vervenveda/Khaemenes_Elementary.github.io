name: Grade Four Late-Year Instructional Depth
on:
  workflow_dispatch:
  push:
    branches: [audit/elementary-family-report-2026-11-09]
    paths:
      - assets/khaemenes-grade4-late-year-depth.js
      - assets/khaemenes-elementary-learning-ledger.js
      - tests/grade-four-late-year-instructional-depth.test.cjs
      - .github/workflows/grade-four-late-year-instructional-depth.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/grade-four-late-year-instructional-depth.test.cjs tests/grade-four-topology-repairs.test.cjs tests/grade-four-family-guardrails.test.cjs tests/grade-three-deep-forensic-round3.test.cjs
