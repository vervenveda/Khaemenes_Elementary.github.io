name: Grade Four Topology Repairs
on:
  workflow_dispatch:
  push:
    branches: [audit/elementary-family-report-2026-11-09]
    paths:
      - grades/grade-04/subjects/social-studies/app.js
      - grades/grade-04/subjects/social-studies/teacher.html
      - grades/grade-04/assets/app.js
      - grades/grade-04/assets/certificate.js
      - assets/khaemenes-grade-four-family-view.js
      - assets/khaemenes-elementary-assessment-engine.js
      - student-profile/index.html
      - tests/grade-four-topology-repairs.test.cjs
      - .github/workflows/grade-four-topology-repairs.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/grade-four-topology-repairs.test.cjs tests/grade-four-family-guardrails.test.cjs tests/grade-one-family-guardrails.test.cjs tests/grade-two-family-guardrails.test.cjs tests/grade-two-post-profile-forensic.test.cjs tests/grade-three-family-guardrails.test.cjs tests/grade-three-instructional-forensic.test.cjs tests/grade-three-deep-forensic-round3.test.cjs
