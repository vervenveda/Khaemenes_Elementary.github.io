name: Verify Legacy Printable Compatibility Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-printable-navigation.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify historical Grade 1 printable URLs only redirect to canonical packets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base="https://vervenveda.com/Khaemenes_Elementary.github.io/grades/grade-01/printables/"
          bad=[]
          for week in range(1,37):
              ww=f"{week:02d}"
              p=Path(f"printables/printables/unit-{ww}-packet.html")
              target=base+f"unit-{ww}-packet.html"
              s=p.read_text(encoding="utf-8") if p.exists() else ""
              if not all(x in s for x in ('http-equiv="refresh"',f'rel="canonical" href="{target}"',f'href="{target}"',f'location.replace("{target}")')):
                  bad.append(str(p))
          assert not bad,bad[:20]
          print("PASS: 36 historical Grade 1 printable routes are read-only canonical redirects.")
          PY
