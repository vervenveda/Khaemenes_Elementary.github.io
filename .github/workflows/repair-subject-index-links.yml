name: Verify Legacy Subject Index Compatibility Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-subject-index-links.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify historical Grade 2 subject indexes only redirect to canonical halls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base="https://vervenveda.com/Khaemenes_Elementary.github.io/grades/grade-02/subjects/"
          subjects=["language-arts","mathematics","science","social-studies","arts-music","health-pe-sel","technology","integrated-projects"]
          extra=["arts-music","health-pe-sel","social-studies","technology"]
          bad=[]
          def check(p,target):
              s=Path(p).read_text(encoding="utf-8") if Path(p).exists() else ""
              if not all(x in s for x in ('http-equiv="refresh"',f'rel="canonical" href="{target}"',f'href="{target}"',f'location.replace("{target}")')):
                  bad.append(p)
          for subject in subjects: check(f"subjects/{subject}/index.html",base+subject+"/index.html")
          for subject in extra: check(f"{subject}/index.html",base+subject+"/index.html")
          assert not bad,bad
          print("PASS: 12 historical Grade 2 subject indexes are read-only canonical redirects.")
          PY
