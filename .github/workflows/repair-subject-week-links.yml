name: Verify Legacy Subject Week Compatibility Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-subject-week-links.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify historical Grade 2 week URLs only redirect to canonical weeks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base="https://vervenveda.com/Khaemenes_Elementary.github.io/grades/grade-02/subjects/"
          subjects=["language-arts","mathematics","science","social-studies","arts-music","health-pe-sel","technology","integrated-projects"]
          extra=["arts-music","health-pe-sel","social-studies","technology"]
          bad=[]
          def check(p,target):
              s=Path(p).read_text(encoding="utf-8") if Path(p).exists() else ""
              if not all(x in s for x in ('http-equiv="refresh"',f'rel="canonical" href="{target}"',f'href="{target}"',f'location.replace("{target}")')):
                  bad.append(p)
          for subject in subjects:
              for week in range(1,37):
                  ww=f"{week:02d}";check(f"subjects/{subject}/week-{ww}.html",base+subject+f"/week-{ww}.html")
          for subject in extra:
              for week in range(1,37):
                  ww=f"{week:02d}";check(f"{subject}/week-{ww}.html",base+subject+f"/week-{ww}.html")
          assert not bad,bad[:20]
          print("PASS: 432 historical Grade 2 week routes are read-only canonical redirects.")
          PY
