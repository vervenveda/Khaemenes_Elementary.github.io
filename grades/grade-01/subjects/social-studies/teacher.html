<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Grade 1 Social Studies Teacher Tools</title><style>body{margin:0;background:#f5f0e4;color:#203129;font:400 15px/1.6 "Avenir Next","Segoe UI",sans-serif}.shell{width:min(1150px,calc(100% - 28px));margin:auto;padding:28px}.card{background:#fff;border:1px solid #d6d8d1;border-radius:7px;padding:18px;margin:12px 0}h1,h2{font-family:Georgia,serif;font-weight:400}button,a,input{font:inherit;padding:8px 12px;border:1px solid #adb7b0;border-radius:7px;background:#fff;color:#203129;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:left}</style></head><body><main class="shell"><div class="actions"><a href="index.html">← Student Course</a><a href="../../index.html">Grade 1 Home</a></div><h1>Khaemenes Academy</h1><h2>Grade 1 Social Studies · Teacher Tools</h2><div class="card"><p>Convenience gate only; this is static GitHub Pages, not secure authentication. Do not store sensitive student information.</p><label>Passcode <input id="code" type="password"><button id="open">Open</button></label></div><div id="tools"></div></main><script src="course-data.js"></script><script>
(()=>{
 const C=window.KHAEMENES_GRADE1_SOCIAL_STUDIES,K=C.metadata.storageKey,$=s=>document.querySelector(s);
 function load(){try{return JSON.parse(localStorage.getItem(K))||{students:[]}}catch{return{students:[]}}}
 function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
 function render(){
   const db=load();
   const cards=(db.students||[]).map(s=>{
     s.weeks||={};s.exams||={midterm:{},final:{}};
     const mastered=C.weeks.filter(w=>(s.weeks[w.week]?.best||0)>=80).length;
     const rows=C.weeks.map(w=>{const r=s.weeks[w.week]||{};return `<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc((r.artifact||"").slice(0,70))}</td></tr>`}).join("");
     return `<div class="card"><h2>${esc(s.name)} · ${mastered}/36 mastered · Midterm ${s.exams.midterm?.best||"—"} · Final ${s.exams.final?.best||"—"}</h2><table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Artifact</th></tr>${rows}</table></div>`;
   }).join("");
   $("#tools").innerHTML=`<div class="card actions"><button id="export">Export JSON</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label><button id="printBtn">Print</button></div>${cards||'<div class="card">No local learners.</div>'}`;
   $("#export").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="grade1-social-studies-backup.json";a.click();URL.revokeObjectURL(a.href)};
   $("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(K,JSON.stringify(JSON.parse(r.result)));render();alert("Imported.")}catch{alert("Invalid JSON.")}};r.readAsText(f)};
   $("#printBtn").onclick=()=>window.print();
 }
 $("#open").onclick=()=>{if($("#code").value!=="KHAE1SS")return alert("Incorrect convenience code.");render()};
})();
</script><a id="vnvBetaProgramFallback" href="https://vervenveda.com/beta/?source=Khaemenes_Elementary.github.io%2Fgrades%2Fgrade-01%2Fsubjects%2Fsocial-studies%2Fteacher.html&surface=learning-page" aria-label="Open the Verve N Veda Beta Program for this page">β Beta Program</a><script src="https://vervenveda.com/assets/vnv-beta-link.js" defer data-vnv-beta-program="2"></script></body></html>
