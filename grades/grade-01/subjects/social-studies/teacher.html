<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Grade 1 Social Studies Teacher Tools</title><style>body{margin:0;background:#f5efe1;color:#203029;font:400 15px/1.62 "Avenir Next","Segoe UI",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 30px));margin:auto;padding:28px 0}.card{background:#fff;border:1px solid #d6d9d2;border-radius:7px;padding:18px;margin:14px 0}.button,button{min-height:40px;padding:8px 12px;border:1px solid #aeb9b2;border-radius:7px;background:#fff;color:#203029}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d6d9d2;padding:7px;text-align:left;vertical-align:top}h1,h2{font-family:Cinzel,Georgia,serif;font-weight:400}.small{font-size:12.5px;color:#66716b}@media print{.noPrint{display:none}}</style></head><body><main class="shell"><div class="actions noPrint"><a class="button" href="index.html">← Student Course</a><a class="button" href="../../index.html">Grade 1 Home</a></div><h1>Khaemenes Academy</h1><h2>Grade 1 Social Studies · Teacher Tools</h2><section class="card"><p><strong>Static-site boundary:</strong> this convenience code is not secure authentication. It inspects the browser's learner-scoped subject record.</p><label>Convenience code <input id="code" type="password"> <button id="open">Open</button></label></section><div id="tools"></div></main><script src="https://vervenveda.com/Khaemenes_Academy.github.io/assets/khaemenes-family-registry.js"></script><script src="../../assets/khaemenes-grade1-subject-context.js"></script><script src="course-data.js"></script><script>
(()=>{const C=window.KHAEMENES_GRADE1_SOCIAL_STUDIES,M=C.metadata,SUB=window.KhaemenesGrade1SubjectContext||null,LEGACY=M.storageKey,$=s=>document.querySelector(s);function key(){return SUB?.scopedKey?.()||LEGACY}function load(){try{const k=key(),v=localStorage.getItem(k);if(v)return JSON.parse(v);if(k!==LEGACY&&localStorage.getItem(LEGACY)){localStorage.setItem(k,localStorage.getItem(LEGACY));return JSON.parse(localStorage.getItem(LEGACY))}}catch{}return{students:[]}}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function render(){const db=load();const cards=(db.students||[]).map(s=>{s.weeks||={};s.exams||={midterm:{},final:{}};const mastered=C.weeks.filter(w=>(s.weeks[w.week]?.best||0)>=80).length;const rows=C.weeks.map(w=>{const r=s.weeks[w.week]||{};return`<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc((r.correction||"").slice(0,80))}</td><td>${esc((r.artifact||"").slice(0,80))}</td></tr>`}).join("");return`<section class="card"><h2>${esc(s.name)} · ${mastered}/36 mastered · Midterm ${s.exams.midterm?.best||"—"} · Final ${s.exams.final?.best||"—"}</h2><table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Correction</th><th>Portfolio</th></tr>${rows}</table></section>`}).join("");$("#tools").innerHTML=`<section class="card"><div class="actions noPrint"><button id="export">Export JSON</button><label class="button">Import JSON <input id="import" type="file" accept=".json,application/json" style="display:none"></label><button id="print">Print</button></div><p class="small">Formal subject progression requires 80% on weekly gates, midterm, and final. Fresh retakes prioritize unseen questions from the current bank.</p></section>${cards||'<section class="card">No subject learners stored in this browser/context.</section>'}`;$("#export").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="grade1-social-studies-backup.json";a.click();URL.revokeObjectURL(a.href)};$("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(key(),JSON.stringify(JSON.parse(r.result)));render();alert("Imported.")}catch{alert("Invalid JSON.")}};r.readAsText(f)};$("#print").onclick=()=>window.print()}$("#open").onclick=()=>{if($("#code").value!=="KHAE1SS")return alert("Incorrect convenience code.");render()}})();
</script></body></html>
