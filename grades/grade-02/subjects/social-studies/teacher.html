<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaemenes Academy · Grade 2 Social Studies Teacher Tools</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="padding:28px 0"><div class="actions"><a class="button" href="index.html">← Student Course</a><a class="button" href="../../index.html">Grade 2 Home</a></div><h1 style="font-size:42px">Khaemenes Academy</h1><h2>Grade 2 Social Studies · Teacher Tools</h2><section class="card"><p><strong>Static-site boundary:</strong> this convenience code is not secure authentication. The page inspects and exports the local/learner-scoped subject record.</p><label>Convenience code <input id="code" type="password"> <button id="open">Open</button></label></section><div id="tools"></div></main><script src="https://vervenveda.com/Khaemenes_Academy.github.io/assets/khaemenes-family-registry.js"></script><script src="../../assets/khaemenes-grade2-subject-context.js"></script><script src="course-data.js"></script><script>
(()=>{const C=window.KHAEMENES_GRADE2_SOCIAL_STUDIES,M=C.metadata,SUBCTX=window.KhaemenesGrade2SubjectContext||null,LEGACY=M.storageKey,$=s=>document.querySelector(s);function key(){return SUBCTX?.scopedKey?.("social-studies")||LEGACY}function load(){try{return JSON.parse(localStorage.getItem(key()))||{students:[]}}catch{return{students:[]}}}function save(db){localStorage.setItem(key(),JSON.stringify(db))}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}function ensure(s){s.weeks||={};s.exams||={};s.localization||={statePack:"generic",stateLabel:"",updatedAt:null};for(const k of ["midterm","final"]){s.exams[k]||={best:0,attempts:[]};s.exams[k].reviewStatus??="observed"}for(let w=1;w<=36;w++){s.weeks[w]||={};s.weeks[w].reviewStatus??="observed";s.weeks[w].localizationEvidence??=""}}function review(v,a){return `<select ${a}><option value="observed" ${v==="observed"?"selected":""}>Observed</option><option value="revise" ${v==="revise"?"selected":""}>Revise</option><option value="accepted" ${v==="accepted"?"selected":""}>Accepted</option></select>`}function render(){const db=load();(db.students||[]).forEach(ensure);const cards=(db.students||[]).map(s=>{const mastered=C.weeks.filter(w=>(s.weeks[w.week]?.best||0)>=80).length,accepted=C.weeks.filter(w=>s.weeks[w.week]?.reviewStatus==="accepted").length;const rows=C.weeks.map(w=>{const r=s.weeks[w.week]||{},loc=M.localizationCheckpoints.includes(w.week)?`<textarea data-loc-week="${w.week}" data-student="${s.id}" rows="2">${esc(r.localizationEvidence||"")}</textarea>`:"—";return `<tr><td>${w.week}</td><td>${esc(w.title)}</td><td>${r.best?r.best+"%":"—"}</td><td>${r.attempts?.length||0}</td><td>${esc(((r.artifact||"")+" "+(r.reflection||"")).slice(0,110))}</td><td>${review(r.reviewStatus,`data-review-week="${w.week}" data-student="${s.id}"`)}</td><td>${loc}</td></tr>`}).join("");return `<section class="card"><h2>${esc(s.name)} · ${mastered}/36 objective gates · ${accepted}/36 evidence records accepted</h2><div class="assessmentBanner"><h3>State/local context</h3><label>Pack <select data-pack="${s.id}"><option value="generic" ${s.localization.statePack==="generic"?"selected":""}>Generic state/local</option><option value="florida" ${s.localization.statePack==="florida"?"selected":""}>Florida</option></select></label> <label>Label <input data-label="${s.id}" value="${esc(s.localization.stateLabel||"")}" placeholder="e.g., Florida · local community"></label> <button data-save-loc="${s.id}">Save context</button></div><div class="assessmentBanner">Midterm portfolio review: ${review(s.exams.midterm.reviewStatus,`data-exam-review="midterm" data-student="${s.id}"`)} · Final portfolio review: ${review(s.exams.final.reviewStatus,`data-exam-review="final" data-student="${s.id}"`)}</div><table><tr><th>Week</th><th>Topic</th><th>Best</th><th>Attempts</th><th>Oral / Drawn / Portfolio Evidence</th><th>Review</th><th>Localization Evidence</th></tr>${rows}</table></section>`}).join("");$("#tools").innerHTML=`<section class="card"><div class="actions"><button id="export">Export JSON</button><label class="button">Import JSON <input id="import" style="display:none" type="file" accept=".json,application/json"></label><button id="printBtn">Print</button></div><p class="small">Observed / revise / accepted is a qualitative evidence record. It never blocks or alters the automatic 80% objective mastery gate.</p></section>${cards||'<section class="card">No subject learners stored in this browser/context.</section>'}`;document.querySelectorAll("[data-review-week]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.weeks[el.dataset.reviewWeek].reviewStatus=el.value;save(db)});document.querySelectorAll("[data-exam-review]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.exams[el.dataset.examReview].reviewStatus=el.value;save(db)});document.querySelectorAll("[data-loc-week]").forEach(el=>el.onchange=()=>{const s=db.students.find(x=>x.id===el.dataset.student);ensure(s);s.weeks[el.dataset.locWeek].localizationEvidence=el.value;save(db)});document.querySelectorAll("[data-save-loc]").forEach(btn=>btn.onclick=()=>{const s=db.students.find(x=>x.id===btn.dataset.saveLoc);ensure(s);s.localization.statePack=document.querySelector(`[data-pack="${s.id}"]`).value;s.localization.stateLabel=document.querySelector(`[data-label="${s.id}"]`).value.trim();s.localization.updatedAt=new Date().toISOString();save(db);render()});$("#export").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="grade2-social-studies-backup.json";a.click();URL.revokeObjectURL(a.href)};$("#import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(key(),JSON.stringify(JSON.parse(r.result)));render()}catch{alert("Invalid JSON.")}};r.readAsText(f)};$("#printBtn").onclick=()=>window.print()}$("#open").onclick=()=>{if($("#code").value!=="KHAE2SS")return alert("Incorrect convenience code.");render()}})();
</script>
