<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 3 Social Studies Printable</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell" style="padding:24px 0"><div class="actions noPrint"><a class="button" id="back" href="index.html">← Course</a><button onclick="window.print()">Print</button></div><div id="page"></div></main><script src="course-data.js"></script><script>(()=>{const C=window.KHAEMENES_GRADE3_SOCIAL_STUDIES,w=Math.min(36,Math.max(1,Number(new URLSearchParams(location.search).get("week"))||1)),x=C.weeks[w-1],e=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));document.title=`Grade 3 Social Studies · Week ${w} Printable`;document.querySelector("#back").href=`index.html?week=${w}`;document.querySelector("#page").innerHTML=`<section class="card"><p class="eyebrow">Khaemenes Academy · Grade 3 Social Studies · Week ${w}</p><h1 style="font-size:38px">${e(x.title)}</h1><p><strong>Unit:</strong> ${e(x.unit)}</p><p><strong>Essential Question:</strong> ${e(x.essentialQuestion)}</p><p>${e(x.keyIdea)}</p><h2>Vocabulary</h2><ul>${x.vocabulary.map(v=>`<li><strong>${e(v.term)}:</strong> ${e(v.definition)}</li>`).join("")}</ul></section><section class="card"><h2>Khaemenes Source Studio</h2><div id="sourceStudio"></div></section><section class="card"><h2>Five-Day Plan</h2>${x.lessons.map(l=>`<div class="lesson"><h3>${e(l.day)} · ${e(l.title)}</h3><p><strong>Objective:</strong> ${e(l.objective)}</p><p>${e(l.activity)}</p><p><strong>Evidence:</strong> ${e(l.evidence)}</p></div>`).join("")}</section><section class="card"><h2>Constructed Evidence Response</h2><p>${e(x.constructedResponse)}</p><div style="height:260px;background:repeating-linear-gradient(#fff,#fff 31px,#ddd 32px)"></div></section><section class="card"><h2>Source / Evidence Notes</h2><div style="height:300px;background:repeating-linear-gradient(#fff,#fff 31px,#ddd 32px)"></div></section>`;const ss=x.sourceStudio,box=document.querySelector("#sourceStudio");if(box&&ss){box.innerHTML=ss.sources.map(s=>`<div class="lesson"><h3>Source ${e(s.id)} · ${e(s.type)}</h3>${s.content?`<p>${e(s.content)}</p>`:""}${(s.rows||[]).length?`<ul>${s.rows.map(r=>`<li><strong>${e(r[0])}:</strong> ${e(r[1])}</li>`).join("")}</ul>`:""}${(s.findings||[]).length?`<ul>${s.findings.map(f=>`<li>${e(f.question)} — ${e(f.finding)}</li>`).join("")}</ul>`:""}<p><small>${e(s.citation)}</small></p></div>`).join("")} })();</script>
